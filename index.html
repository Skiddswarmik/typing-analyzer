<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TypeMaster Vanilla</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0a0a0a;
  color:#e8e8e8;
  font-family:monospace;
  padding:20px;
}

#words span{
  margin-right:10px;
  color:#555;
}

#words .active{
  color:#fff;
}

input{
  margin-top:20px;
  padding:10px;
  width:100%;
  background:#111;
  color:#fff;
  border:1px solid #333;
}

.controls{
  margin-bottom:20px;
}

.notification{
  position:fixed;
  top:20px;
  right:20px;
  background:white;
  color:black;
  padding:16px;
  border-radius:8px;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
}

.notification button{
  background:black;
  color:white;
  border:none;
  padding:8px 12px;
  margin-right:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<script src="quotes.js"></script>

<div class="controls">
  <label><input type="checkbox" id="punctuation"> punctuation</label>
  <label><input type="checkbox" id="numbers"> numbers</label>
  <label><input type="checkbox" id="numbersOnly"> numbers only</label>
</div>

<h2 id="wpm">0 WPM</h2>
<h3 id="raw"></h3>

<div id="words"></div>
<input id="input" autofocus>

<div id="notification"></div>

<script>
const WORD_POOL = "the quick brown fox jumps over lazy dog typing speed keyboard practice improve skill accuracy focus consistency".split(" ");

let words=[], index=0, input="", start=null;
let typedWords=[];
let quoteCount=0;

const inputEl = document.getElementById("input");
const wordsEl = document.getElementById("words");
const wpmEl = document.getElementById("wpm");
const rawEl = document.getElementById("raw");
const notificationEl = document.getElementById("notification");

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function numberWord(){
  let len=rand(3,7), s="";
  for(let i=0;i<len;i++) s+=rand(0,9);
  return s;
}

function inject(word){
  if(document.getElementById("punctuation").checked && Math.random()<0.2){
    const p=[".",",","!","?"];
    word+=p[rand(0,p.length-1)];
  }
  if(document.getElementById("numbers").checked && Math.random()<0.2){
    word+=rand(0,9);
  }
  return word;
}

function genWords(n){
  let result=[];

  function pick(target){
    let c=WORD_POOL.filter(w=>Math.abs(w.length-target)<=2);
    if(!c.length) c=WORD_POOL;
    return c[rand(0,c.length-1)];
  }

  while(result.length<n){
    let chunk=[], total=0;

    for(let i=0;i<4;i++){
      let remaining=20-total;
      let slots=4-i;
      let target=Math.round(remaining/slots);

      let word;
      if(document.getElementById("numbersOnly").checked){
        word=numberWord();
      }else{
        word=pick(target);
        word=inject(word);
      }

      chunk.push(word);
      total+=word.length;
    }

    result.push(...chunk);
  }

  return result.slice(0,n);
}

function renderWords(){
  wordsEl.innerHTML="";
  words.forEach((w,i)=>{
    let span=document.createElement("span");
    span.textContent=w;
    if(i===index) span.classList.add("active");
    wordsEl.appendChild(span);
  });
}

function init(){
  words=genWords(40);
  index=0;
  typedWords=[];
  input="";
  start=null;
  rawEl.textContent="";
  inputEl.value="";
  renderWords();
}

function finish(){
  let mins=(Date.now()-start)/60000;

  let totalChars=typedWords.reduce((s,w)=>s+w.length,0);
  let rawWpm=Math.round((totalChars/5)/mins)||0;

  rawEl.textContent="RAW WPM: "+rawWpm;

  quoteCount++;
  if(quoteCount>=3){
    showNotification();
    quoteCount=0;
  }
}

function showNotification(){
  notificationEl.innerHTML=`
    <div class="notification">
      <div>Practice weak keys now?</div>
      <div style="margin-top:10px;">
        <button onclick="tryNow()">TRY NOW</button>
        <button onclick="dismiss()">DISMISS</button>
      </div>
    </div>
  `;
}

function tryNow(){
  notificationEl.innerHTML="";
  init();
}

function dismiss(){
  notificationEl.innerHTML="";
}

inputEl.addEventListener("input",(e)=>{
  let val=e.target.value;

  if(!start) start=Date.now();

  if(val.endsWith(" ")){
    typedWords.push(val.trim());
    index++;
    inputEl.value="";

    if(index>=words.length){
      finish();
    }

    renderWords();
    return;
  }

  let elapsed=(Date.now()-start)/60000;
  let chars=typedWords.reduce((s,w)=>s+w.length,0)+val.length;
  let wpm=Math.round((chars/5)/elapsed)||0;

  wpmEl.textContent=wpm+" WPM";
});

document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
  cb.addEventListener("change",init);
});

init();
</script>

</body>
</html>
