<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TypeMaster</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{background:#0a0a0a;color:#e8e8e8;font-family:monospace}
button{cursor:pointer}
.notification{
  position:fixed;top:20px;right:20px;
  background:white;color:black;
  padding:16px;border-radius:8px;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  z-index:999;
}
.notification button{
  background:black;color:white;border:none;
  padding:8px 12px;margin-right:8px;
}
</style>
</head>

<body>

<script src="quotes.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<div id="root"></div>

<script>
const h = React.createElement;
const {useState,useEffect,useRef} = React;

const WORD_POOL = "the quick brown fox jumps over lazy dog typing speed keyboard practice improve skill accuracy focus consistency".split(" ");

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function randomNumberWord(){
  let len = randomInt(3,7);
  let str="";
  for(let i=0;i<len;i++) str+=randomInt(0,9);
  return str;
}

function injectExtras(word, usePunc, useNum){
  if(usePunc && Math.random()<0.2){
    const p = [".",",","!","?"];
    word += p[randomInt(0,p.length-1)];
  }
  if(useNum && Math.random()<0.2){
    word += randomInt(0,9);
  }
  return word;
}

function genWords(n, options){
  const {punctuation, numbers, numbersOnly} = options;
  let result = [];

  function pick(target){
    let candidates = WORD_POOL.filter(w=>Math.abs(w.length-target)<=2);
    if(candidates.length===0) candidates = WORD_POOL;
    return candidates[randomInt(0,candidates.length-1)];
  }

  while(result.length<n){
    let chunk=[], total=0;

    for(let i=0;i<4;i++){
      let remaining = 20-total;
      let slots = 4-i;
      let target = Math.round(remaining/slots);

      let word;
      if(numbersOnly){
        word = randomNumberWord();
      }else{
        word = pick(target);
        word = injectExtras(word,punctuation,numbers);
      }

      chunk.push(word);
      total += word.length;
    }

    result.push(...chunk);
  }

  return result.slice(0,n);
}

function App(){
  const [words,setWords] = useState([]);
  const [input,setInput] = useState("");
  const [index,setIndex] = useState(0);
  const [start,setStart] = useState(null);
  const [wpm,setWpm] = useState(0);
  const [results,setResults] = useState(null);
  const [quoteCount,setQuoteCount] = useState(0);
  const [notification,setNotification] = useState(null);

  const [punctuation,setPunctuation]=useState(false);
  const [numbers,setNumbers]=useState(false);
  const [numbersOnly,setNumbersOnly]=useState(false);

  const ref = useRef([]);

  function init(){
    setWords(genWords(40,{punctuation,numbers,numbersOnly}));
    setIndex(0);
    setInput("");
    setStart(null);
    setResults(null);
  }

  useEffect(init,[punctuation,numbers,numbersOnly]);

  function finish(){
    let mins=(Date.now()-start)/60000;
    let chars = ref.current.reduce((s,w)=>s+w.length,0);
    let raw = Math.round((chars/5)/mins);
    setResults(raw);

    let newCount = quoteCount+1;
    setQuoteCount(newCount);

    if(newCount>=3){
      setNotification(true);
      setQuoteCount(0);
    }
  }

  function handle(e){
    let val=e.target.value;

    if(!start) setStart(Date.now());

    if(val.endsWith(" ")){
      ref.current.push(val.trim());
      setIndex(i=>i+1);
      setInput("");

      if(index>=words.length-1) finish();
      return;
    }

    setInput(val);

    if(start){
      let mins=(Date.now()-start)/60000;
      let chars = ref.current.reduce((s,w)=>s+w.length,0)+val.length;
      setWpm(Math.round((chars/5)/mins)||0);
    }
  }

  return h("div",{},
    notification && h("div",{className:"notification"},
      h("div",{},"Practice weak keys now?"),
      h("div",{},
        h("button",{onClick:()=>{setNotification(false);init();}},"TRY NOW"),
        h("button",{onClick:()=>setNotification(false)},"DISMISS")
      )
    ),

    h("div",{},
      h("label",{},h("input",{type:"checkbox",checked:punctuation,onChange:()=>setPunctuation(!punctuation)})," punctuation"),
      h("label",{},h("input",{type:"checkbox",checked:numbers,onChange:()=>setNumbers(!numbers)})," numbers"),
      h("label",{},h("input",{type:"checkbox",checked:numbersOnly,onChange:()=>setNumbersOnly(!numbersOnly)})," numbers only")
    ),

    h("h2",{},wpm+" WPM"),

    h("div",{},
      words.map((w,i)=>
        h("span",{key:i,style:{marginRight:10,color:i===index?"white":"#555"}},w)
      )
    ),

    h("input",{value:input,onChange:handle,autoFocus:true}),

    results && h("h1",{},"RAW WPM: "+results)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
